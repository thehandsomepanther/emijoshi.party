<!DOCTYPE html>
<meta name="robots" content="noindex">
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
  <title>emijoshi party</title>
  <style>
    :root {
      --base-rem: 4rem;
    }

    span,
    p {
      font-family: "Doto", serif;
      font-optical-sizing: auto;
      font-size: var(--base-rem);
      font-weight: 800;
      font-style: normal;
      font-variation-settings: "ROND" 0;
      margin-top: 0;
      margin-bottom: 0;
    }

    #save-the-container {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      row-gap: var(--base-rem);
      margin: var(--base-rem) 0;
    }

    #save-the-container>p {
      display: inline-block;
      vertical-align: top;
      margin-right: calc(var(--base-rem) / 4);
    }

    #save-the-container>img {
      display: inline-block;
      z-index: -1;
      height: var(--base-rem);
      width: auto;
      scale: 4;
      margin-left: calc(var(--base-rem) * 1.5);
    }
  </style>
</head>

<body>
  <span class="anim">e</span>
  <span class="anim">m</span>
  <span class="anim">i</span>
  <span class="anim">j</span>
  <span class="anim">o</span>
  <span class="anim">s</span>
  <span class="anim">h</span>
  <span class="anim">i</span>
  <span class="anim">.</span>
  <span class="anim">p</span>
  <span class="anim">a</span>
  <span class="anim">r</span>
  <span class="anim">t</span>
  <span class="anim">y</span>
  <br>
  <br>
  <br>
  <br>
  <div id="save-the-container">
    <p>save the</p>
    <img src="dates.jpg">
  </div>
  <br>
  <br>
  <br>
  <p>sept 27-28 2025</p>
  <p>chicago il</p>
  <script>
    const spans = document.querySelectorAll('span.anim')
    let f = 0

    function onFrame() {
      for (let i = 0; i < spans.length; i++) {
        const offset = (spans.length - i) * Math.PI / 4
        const x = Math.sin(offset + f)

        spans[i].style.fontWeight = (x + 1) / 2 * 500 + 400
      }

      f++
      setTimeout(onFrame, 150)
    }

    onFrame()
  </script>
</body>

</html>
