<!DOCTYPE html>
<meta name="robots" content="noindex">
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
  <title>emijoshi party</title>
<style id="jsbin-css">
span, p {
  font-family: "Doto", serif;
  font-optical-sizing: auto;
  font-size: 80px;
  font-weight: 800;
  font-style: normal;
  font-variation-settings: "ROND" 0;
}

img {
  width: 600px;
}
</style>
</head>
<body>
  <span class="anim">e</span>
  <span class="anim">m</span>
  <span class="anim">i</span>
  <span class="anim">j</span>
  <span class="anim">o</span>
  <span class="anim">s</span>
  <span class="anim">h</span>
  <span class="anim">i</span>
  <span class="anim">.</span>
  <span class="anim">p</span>
  <span class="anim">a</span>
  <span class="anim">r</span>
  <span class="anim">t</span>
  <span class="anim">y</span>

  <br>
  <br>

  <div>
    <p style="display: inline-block; vertical-align: top;">save the</p>
    <img style="display: inline; margin-left: -30px; margin-top: -10px; width: 400px" src="dates.png" />
  </div>

  <p>sept 27-28 2025</p>
  <p>chicago il</p>
<script>
const spans = document.querySelectorAll('span.anim')
let f = 0

function onFrame() {
  for (let i = 0; i < spans.length; i++) {
    const offset = (spans.length - i) * Math.PI/4
    const x = Math.sin(offset + f)

    spans[i].style.fontWeight = (x + 1) / 2 * 500 + 400
  }

  f++
  setTimeout(onFrame, 150)
}

onFrame()
</script>
</body>
</html>
